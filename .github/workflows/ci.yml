name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.12"
      - run: make setup
      - run: make test-ci

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.12"
      - run: make setup
      - name: Build and wait for healthcheck
        run: make up-test
      - name: Check HTTP contract
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          with urlopen("http://127.0.0.1:18080/health", timeout=5) as response:
              assert response.status == 200
              assert json.load(response) == {"status": "ok"}
          PY
      - name: Test sandbox over HTTP
        run: make test-agent
      - name: Check manager restart and cleanup
        run: make test-lifecycle
      - name: Show logs
        if: always()
        run: docker compose -p are-offline -f docker-compose.yml -f tests/infra/compose.yml logs --no-color
      - name: Clean up
        if: always()
        run: |
          make down-test
          remaining=$(docker ps -aq --filter label=are.owner=are-offline)
          test -z "$remaining"
