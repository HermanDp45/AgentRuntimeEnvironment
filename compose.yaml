services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
