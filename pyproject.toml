[project]
name = "agent-runtime-environment"
version = "0.1.0"
description = "Agent runtime for the ITMO × DeepPavlov course"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
