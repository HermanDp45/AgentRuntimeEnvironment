[project]
name = "agent-runtime-environment"
version = "0.1.0"
description = "Agent runtime for the ITMO × DeepPavlov course"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "pydantic==2.14.2",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/gateway/src", "services/sandbox-manager/src", "services/sandbox-manager/sandbox", "services/harness/src", "services/llm-proxy/src"]
markers = ["docker: requires the running Compose sandbox manager"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [".", "services/gateway/src", "services/sandbox-manager/src", "services/harness/src", "services/llm-proxy/src"]
extend-exclude = ["baf/**/fixture/**", "baf/B1-read/B1.1-service-port/check.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
gui = ["pyside6-essentials==6.10.1"]
dev = [
    "docker==7.2.0",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
]
sandbox-manager = [
    "docker==7.2.0",
]
sandbox = [
    "pytest==9.2.0",
]
