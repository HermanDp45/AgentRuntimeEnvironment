services:
  dns-probe:
    image: python:3.13.15-slim-bookworm@sha256:2325bb286ec344af3e5898cc224b5844e2707ac6e26b1632516fd3edc84a5e26
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    dns_opt: [use-vc]
    command:
      - python
      - -c
      - |
        import json, socket
        from urllib.error import HTTPError
        from urllib.request import urlopen
        report = {"addresses": sorted({item[4][0] for item in socket.getaddrinfo("inference.airi.net", 443)})}
        try:
            with urlopen("https://inference.airi.net", timeout=8) as response:
                report["https_status"] = response.status
        except HTTPError as error:
            report["https_status"] = error.code
        print(json.dumps(report))
